<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Ambient Nebulas -->
    <radialGradient id="banner-nebula-left" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="banner-nebula-right" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.10" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Spectrum Beams -->
    <linearGradient id="b-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="b-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="b-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="b-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="b-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f472b6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0" />
    </linearGradient>

    <!-- Incident Beam -->
    <linearGradient id="b-incident" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Glass Crystal Facets -->
    <linearGradient id="facet-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="facet-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.35" />
    </linearGradient>

    <filter id="b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#banner-bg)" />
  <rect width="1200" height="420" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Nebulas -->
  <rect width="1200" height="420" fill="url(#banner-nebula-left)" />
  <rect width="1200" height="420" fill="url(#banner-nebula-right)" />

  <!-- Geometric Grid Accent Lines -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.3">
    <line x1="80" y1="70" x2="1120" y2="70" />
    <line x1="80" y1="350" x2="1120" y2="350" />
    <circle cx="850" cy="210" r="160" />
    <circle cx="850" cy="210" r="110" />
  </g>

  <!-- LEFT SECTION: BRAND IDENTITY & TYPOGRAPHY -->
  <g transform="translate(90, 110)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#b-glow)" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
        LANGGRAPH × GRAPHRAG
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="#ffffff">
      Prism<tspan fill="#38bdf8">Era</tspan>
      <tspan font-size="28" font-weight="400" fill="#94a3b8" letter-spacing="4"> · 棱镜纪</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
      全球名校申请多智能体光学阵列 · Multi-Agent Optical Array
    </text>

    <!-- Metaphor Prose -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="300" fill="#64748b" letter-spacing="0.2">
      以知识图谱为切面，以检索增强为介质 — 将申请者的「原光」定角、色散、提纯与共鸣
    </text>

    <!-- Agent Color Dots Array -->
    <g transform="translate(0, 185)">
      <!-- Luminary -->
      <circle cx="8" cy="8" r="5" fill="#fbbf24" />
      <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">司光者</text>

      <!-- Facet -->
      <circle cx="85" cy="8" r="5" fill="#34d399" />
      <text x="97" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">切面师</text>

      <!-- Locus -->
      <circle cx="162" cy="8" r="5" fill="#818cf8" />
      <text x="174" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">定焦师</text>

      <!-- Disperser -->
      <circle cx="239" cy="8" r="5" fill="#f472b6" />
      <text x="251" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">折光师</text>

      <!-- Resonator -->
      <circle cx="316" cy="8" r="5" fill="#fb7185" />
      <text x="328" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">共鸣者</text>

      <!-- Echo -->
      <circle cx="393" cy="8" r="5" fill="#38bdf8" />
      <text x="405" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">回音壁</text>
    </g>
  </g>

  <!-- RIGHT SECTION: 3D PRISM DISPERSION ARTWORK -->
  <g transform="translate(100, 0)">
    <!-- Incident Beam entering from x=600 to x=780, y=210 -->
    <g filter="url(#b-glow)">
      <line x1="600" y1="210" x2="775" y2="210" stroke="url(#b-incident)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Dispersed Rays exiting from x=825, y=210 toward the right edge -->
    <g filter="url(#b-glow)">
      <!-- Gold -->
      <path d="M 825 200 L 1080 90 L 1075 102 L 825 203 Z" fill="url(#b-gold)" />
      <!-- Emerald -->
      <path d="M 825 203 L 1085 140 L 1080 152 L 825 207 Z" fill="url(#b-emerald)" />
      <!-- Cyan -->
      <path d="M 825 207 L 1090 195 L 1085 207 L 825 212 Z" fill="url(#b-cyan)" />
      <!-- Indigo -->
      <path d="M 825 212 L 1085 255 L 1080 268 L 825 217 Z" fill="url(#b-indigo)" />
      <!-- Magenta -->
      <path d="M 825 217 L 1075 315 L 1068 328 L 825 222 Z" fill="url(#b-magenta)" />
    </g>

    <!-- 3D Prism Polyhedron -->
    <!-- Apex: (800, 95), Left: (730, 285), Right: (875, 285), Front Point: (815, 310) -->
    <g>
      <!-- Base Shadow -->
      <polygon points="730,285 875,285 815,310" fill="#1e1b4b" opacity="0.6" stroke="#4338ca" stroke-width="1" />
      <!-- Left Facet -->
      <polygon points="800,95 730,285 815,310" fill="url(#facet-a)" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.8" />
      <!-- Right Facet -->
      <polygon points="800,95 815,310 875,285" fill="url(#facet-b)" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.7" />

      <!-- Crystal Highlight Ridge -->
      <line x1="800" y1="95" x2="815" y2="310" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" filter="url(#b-glow)" />

      <!-- Apex Sparkle -->
      <circle cx="800" cy="95" r="3" fill="#ffffff" filter="url(#b-glow)" />
      <circle cx="800" cy="95" r="1.2" fill="#ffffff" />
    </g>

    <!-- Optical Refraction Inner Core -->
    <line x1="775" y1="210" x2="825" y2="208" stroke="#ffffff" stroke-width="3" opacity="0.8" filter="url(#b-glow)" />
    <circle cx="825" cy="208" r="2.5" fill="#38bdf8" filter="url(#b-glow)" />
  </g>
</svg>
